# First enable this HTTP configuration; Certbot adds the TLS certificates/listeners.
# certbot --nginx -d megatools.live -d www.megatools.live
server {
    listen 80;
    server_name www.megatools.live;
    return 301 https://megatools.live$request_uri;
}
server {
    listen 80;
    server_name megatools.live;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location / {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3012;
        proxy_set_header Host $host;
        expires 1y;
        # Keep security headers inherited from this server block.
    }
}
